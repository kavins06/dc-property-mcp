name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            loader/package-lock.json
            scripts/package-lock.json
            worker/package-lock.json
      - run: npm ci --prefix loader
      - run: npm test --prefix loader
      - run: npm ci --prefix scripts
      - run: npm test --prefix scripts
      - run: npm ci --prefix worker
      - run: npm run check --prefix worker
      - run: npm test --prefix worker
